name: GPT Pro 20X Discord Alert

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      send_test:
        description: "Send a Discord test message"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Send Discord test message
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.send_test }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          test -n "$DISCORD_WEBHOOK_URL" || { echo "DISCORD_WEBHOOK_URL secret is missing"; exit 1; }
          curl -fsS -H "Content-Type: application/json" \
            -d '{"content":"✅ GPT Pro 20X 알림 테스트 성공"}' \
            "$DISCORD_WEBHOOK_URL"

      - name: Check official OpenAI pages
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.send_test) }}
        id: status
        shell: bash
        run: |
          set -u

          urls=(
            "https://help.openai.com/en/articles/9793128-what-is-chatgpt-pro"
            "https://help.openai.com/en/articles/7232927-canceling-your-chatgpt-subscription"
            "https://help.openai.com/en/articles/7242622-why-did-my-chatgpt-plus-or-chatgpt-pro-renewal-transaction-fail"
          )

          rm -f /tmp/pro20x_page_*.html
          success=0

          for i in "${!urls[@]}"; do
            url="${urls[$i]}"
            echo "Fetching: $url"

            if curl -L --fail --silent --show-error \
              --retry 3 --retry-delay 3 --retry-all-errors \
              --connect-timeout 20 --max-time 60 \
              -A "Mozilla/5.0 (compatible; GPT-Pro20X-Alert/1.0)" \
              "$url" -o "/tmp/pro20x_page_$i.html"; then
              success=$((success + 1))
            else
              echo "::warning::Could not fetch $url"
            fi
          done

          echo "Successfully fetched $success official page(s)."

          # If OpenAI temporarily blocks GitHub runners, do NOT create a false alert
          # and do NOT mark the scheduled workflow as failed.
          if [ "$success" -lt 2 ]; then
            echo "::warning::Fewer than 2 official pages were reachable. Skipping status decision."
            echo "reopened=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python3 - <<'PY'
          import glob
          import html
          import re

          pages = []
          for path in glob.glob("/tmp/pro20x_page_*.html"):
              with open(path, "r", encoding="utf-8", errors="ignore") as f:
                  raw = f.read()

              raw = re.sub(r"<script\b[^>]*>.*?</script>", " ", raw, flags=re.I | re.S)
              raw = re.sub(r"<style\b[^>]*>.*?</style>", " ", raw, flags=re.I | re.S)
              text = re.sub(r"<[^>]+>", " ", raw)
              text = html.unescape(text)
              text = re.sub(r"\s+", " ", text).lower()
              pages.append(text)

          pause_markers = [
              "temporarily pausing new sign-ups and upgrades",
              "temporarily paused",
              "new sign-ups and upgrades to the chatgpt pro $200 plan",
              "cannot purchase pro $200 until the pause is lifted",
              "until the pause is lifted",
              "pro $200 subscriptions are temporarily paused",
          ]

          pause_hits = sum(
              any(marker in page for marker in pause_markers)
              for page in pages
          )

          tier_hits = sum(
              (
                  "pro $200" in page
                  or "pro 20x" in page
                  or ("$200" in page and "20x" in page)
              )
              for page in pages
          )

          # Conservative rule:
          # - at least 2 official pages must be fetched
          # - none of the fetched pages may still say the pause is active
          # - at least one fetched page must still clearly mention Pro $200 / Pro 20X
          reopened = len(pages) >= 2 and pause_hits == 0 and tier_hits >= 1

          print("pages_checked =", len(pages))
          print("pause_hits =", pause_hits)
          print("tier_hits =", tier_hits)
          print("reopened =", reopened)

          with open("/tmp/reopened.txt", "w", encoding="utf-8") as f:
              f.write("true" if reopened else "false")
          PY

          echo "reopened=$(cat /tmp/reopened.txt)" >> "$GITHUB_OUTPUT"

      - name: Notify Discord once
        if: ${{ steps.status.outputs.reopened == 'true' && hashFiles('.pro20x-alert-sent') == '' }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          test -n "$DISCORD_WEBHOOK_URL" || { echo "DISCORD_WEBHOOK_URL secret is missing"; exit 1; }

          curl -fsS -H "Content-Type: application/json" \
            -d '{"content":"🚨 **GPT Pro 20X 결제 재개 감지**\nOpenAI 공식 도움말 여러 페이지에서 Pro $200 (Pro 20X) 신규 가입/업그레이드 일시 중지 안내가 더 이상 확인되지 않습니다. 결제 페이지에서 실제 구매 가능 여부도 확인해보세요.\nhttps://help.openai.com/en/articles/9793128-what-is-chatgpt-pro"}' \
            "$DISCORD_WEBHOOK_URL"

          date -u +"%Y-%m-%dT%H:%M:%SZ" > .pro20x-alert-sent
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .pro20x-alert-sent
          git commit -m "Record Pro 20X reactivation alert"
          git push
